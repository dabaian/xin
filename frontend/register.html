<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注册 · Viora AI</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/css/app.css?v=20261025">
<style>
.split { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
.left { display: grid; place-items: center; padding: 40px 24px; background: #fff; }
.right {
  position: relative; overflow: hidden; padding: 44px; color: #fff;
  background: linear-gradient(150deg, #14171D 0%, #1B2029 50%, #241A13 100%);
  display: flex; flex-direction: column; justify-content: center;
}
.right::before { content: ''; position: absolute; right: -140px; top: -120px; width: 560px; height: 560px;
  background: radial-gradient(circle, rgba(255,90,31,.4), transparent 62%); }
.right > * { position: relative; z-index: 1; }
.right h2 { font-size: 30px; line-height: 1.3; letter-spacing: -.02em; margin: 0 0 12px; }
.right p { color: rgba(255,255,255,.6); font-size: 13.5px; line-height: 1.8; max-width: 360px; }
.bonus {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 22px;
  padding: 10px 16px; border-radius: 12px; background: rgba(255,90,31,.14);
  border: 1px solid rgba(255,90,31,.32); color: #FFB08A; font-weight: 600; font-size: 13px;
}
.form { width: 100%; max-width: 372px; }
.hint { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
.strength { height: 3px; border-radius: 3px; background: var(--line-2); margin-top: 8px; overflow: hidden; }
.strength i { display: block; height: 100%; width: 0; transition: all .2s; }
.cap-row { display: flex; gap: 10px; align-items: stretch; }
.cap-row .input { flex: 1 1 auto; min-width: 0; letter-spacing: .3em; text-transform: uppercase; font-weight: 600; }
.cap-img {
  flex: 0 0 auto; width: 132px; height: 44px; border-radius: 9px;
  border: 1px solid var(--line); background: #F7F8FA; cursor: pointer;
  object-fit: cover; transition: opacity .15s, border-color .15s;
}
.cap-img:hover { border-color: var(--brand-line); }
.cap-img.loading { opacity: .4; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } .right { display: none; } }
</style>
</head>
<body>
<div class="split">
  <div class="left">
    <div class="form">
      <h2 class="h2" style="margin-bottom:6px">创建账号</h2>
      <p class="sub mb24">注册即送 <b style="color:var(--brand-ink)" id="bonusTip">体验积分</b>，够生成两条作品</p>
      <form id="form">
        <div class="field">
          <label class="label">邮箱</label>
          <input class="input" id="email" type="email" autocomplete="email"
                 placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label class="label">昵称 <span class="muted" style="font-weight:400">选填</span></label>
          <input class="input" id="username" type="text" maxlength="32" placeholder="怎么称呼你">
        </div>
        <div class="field">
          <label class="label">密码</label>
          <input class="input" id="password" type="password" autocomplete="new-password"
                 placeholder="至少 6 位" required>
          <div class="strength"><i id="sbar"></i></div>
          <div class="hint" id="stip">建议字母 + 数字组合</div>
        </div>
        <div class="field" id="capField">
          <label class="label">人机验证</label>
          <div class="gt-box" id="gtBox" hidden>
            <button class="btn btn-block" id="gtBtn" type="button">点击完成安全验证</button>
            <div class="gt-done" id="gtDone" hidden><span class="gt-tick">✓</span>已完成验证</div>
          </div>
          <div class="cap-row" id="imgRow" hidden>
            <input class="input" id="capCode" type="text" maxlength="4" autocomplete="off"
                   inputmode="text" placeholder="输入右侧 4 位">
            <img class="cap-img" id="capImg" alt="验证码" title="点击刷新">
          </div>
          <div class="hint" id="capTip">点按钮完成安全验证</div>
        </div>
        <div class="field" id="mailField">
          <label class="label">邮箱验证码</label>
          <div class="cap-row">
            <input class="input" id="mailCode" type="text" maxlength="6" autocomplete="one-time-code"
                   inputmode="numeric" placeholder="6 位数字">
            <button class="btn" id="sendCode" type="button" style="flex:0 0 auto;min-width:112px">获取验证码</button>
          </div>
          <div class="hint" id="mailTip">点「获取验证码」，我们会发到上面的邮箱</div>
        </div>
        <button class="btn btn-primary btn-lg btn-block mt16" id="submit" type="submit">注册并登录</button>
      </form>
      <p class="sub center mt24">已有账号？<a href="/login" style="color:var(--brand);font-weight:600">直接登录</a></p>
    </div>
  </div>
  <div class="right">
    <h2>从注册到出片，<br>不超过 3 分钟。</h2>
    <p>不需要信用卡，不用下载软件。写一句描述，选好比例，点生成，剩下交给渲染队列。</p>
    <div class="bonus">🎁 新用户注册即赠体验积分</div>
  </div>
</div>
<!-- 后端地址等运行时配置由服务端下发；前端独立部署时放一个同内容的 config.js 即可 -->
<script src="/config.js"></script>
<script src="/assets/js/core.js?v=20261025"></script>
<script>
(function () {
  get('/api/auth/me').then(() => { location.href = '/studio'; }).catch(() => {});

  const pwd = $('#password'), sbar = $('#sbar'), stip = $('#stip');

  /* ---------------- 人机验证（极验 v4，未配置时自动退回图形码） ---------------- */
  let capOn = false, capImgOn = false, capId = '';

  async function loadImageCaptcha() {
    const img = $('#capImg');
    if (!img) return;
    img.classList.add('loading');
    try {
      const r = await get('/api/auth/captcha');
      if (!r || r.enabled === false) { $('#imgRow').hidden = true; return; }
      capId = r.id;
      img.src = r.image;
      $('#capCode').value = '';
    } catch (err) {
      $('#capTip').textContent = '验证码加载失败（' + ((err && err.message) || err) + '），点图片重试';
    } finally {
      img.classList.remove('loading');
    }
  }

  async function initCaptcha() {
    const mode = await Gt4.init();
    if (mode === 'off') {
      capOn = false;
      $('#capField').style.display = 'none';
      return;
    }
    capOn = true;
    if (mode === 'image') {
      capImgOn = true;
      $('#imgRow').hidden = false;
      $('#capTip').textContent = '看不清？点一下图片换一张';
      loadImageCaptcha();
      $('#capImg').addEventListener('click', loadImageCaptcha);
    } else if (mode === 'geetest-error') {
      $('#gtBox').hidden = false;
      $('#gtBtn').disabled = true;
      $('#gtBtn').textContent = '安全验证加载失败';
      $('#capTip').innerHTML = '<span style="color:var(--bad)">' +
        '安全验证组件加载失败，请关闭广告拦截插件后刷新页面，或换用 Chrome / Edge 重试</span>';
    } else {
      $('#gtBox').hidden = false;
      $('#capTip').textContent = '点击按钮，按提示完成滑块验证';
    }
  }
  initCaptcha();

  /* 取一次验证凭据：极验返回四参，图形码返回 {image:true}，用户取消返回 null */
  let capCache = null, capCacheAt = 0;

  function flashDone() {
    const btn = $('#gtBtn'), done = $('#gtDone');
    btn.hidden = true; done.hidden = false;
    setTimeout(() => { btn.hidden = false; done.hidden = true; }, 1600);
  }

  async function runGt() {
    const p = await Gt4.run();
    if (!p) {
      if (Gt4.mode === 'geetest-error') toast('安全验证组件加载失败，请刷新页面重试', 'bad');
      return null;
    }
    // 极验参数只能用一次，先缓存起来给紧接着的「获取验证码」用
    capCache = Gt4.payload(p);
    capCacheAt = Date.now();
    flashDone();
    return capCache;
  }

  async function grabCaptcha() {
    if (!capOn) return {};
    if (capImgOn) {
      const code = $('#capCode').value.trim();
      if (!code) { toast('请先填写右侧的图形验证码', 'warn'); $('#capCode').focus(); return null; }
      return { captcha_id: capId, captcha_code: code };
    }
    // 2 分钟内复用刚点按钮拿到的凭据，避免用户连点两次滑块
    if (capCache && Date.now() - capCacheAt < 120000) {
      const c = capCache; capCache = null;
      return c;
    }
    return await runGt();
  }

  $('#gtBtn').addEventListener('click', () => { if (!capImgOn) runGt(); });

  /* ---------------- 邮箱验证码 ---------------- */
  let mailOn = true, coolTimer = null;

  function startCooldown(sec) {
    const btn = $('#sendCode');
    let left = sec;
    btn.disabled = true;
    btn.textContent = left + ' 秒后重发';
    clearInterval(coolTimer);
    coolTimer = setInterval(() => {
      left -= 1;
      if (left <= 0) {
        clearInterval(coolTimer);
        btn.disabled = false;
        btn.textContent = '重新获取';
      } else {
        btn.textContent = left + ' 秒后重发';
      }
    }, 1000);
  }

  async function sendCode() {
    const email = $('#email').value.trim();
    if (!email) { toast('请先填写邮箱', 'warn'); $('#email').focus(); return; }
    const cap = await grabCaptcha();
    if (cap === null) return;
    const btn = $('#sendCode');
    btn.disabled = true; btn.textContent = '发送中…';
    try {
      const r = await post('/api/auth/email-code', {
        email: email,
        purpose: 'register',
        ...cap,
      });
      startCooldown(r.cooldown || 60);
      $('#mailCode').focus();
      if (r.echo) {
        // 演示模式：没配 SMTP，验证码直接回显，方便先把流程走通
        $('#mailCode').value = r.dev_code || '';
        $('#mailTip').innerHTML = '<span style="color:var(--warn)">演示模式：邮件服务未配置，验证码已自动填入（' +
          (r.dev_code || '') + '）</span>';
        toast('演示模式：验证码已填入', 'warn');
      } else {
        $('#mailTip').textContent = '已发送到 ' + email + '，' + Math.round((r.ttl || 600) / 60) + ' 分钟内有效';
        toast('验证码已发送', 'ok');
      }
    } catch (err) {
      btn.disabled = false; btn.textContent = '获取验证码';
      toast(err.message || '发送失败', 'bad');
      if (capImgOn) loadImageCaptcha();
    }
  }

  $('#sendCode').addEventListener('click', sendCode);

  // 后端可以整体关掉邮箱验证（EMAIL_CODE_REQUIRED=0），那就把这一栏藏起来
  get('/api/auth/mail/config').then((r) => {
    if (r && r.email_code_required === false) {
      mailOn = false;
      $('#mailField').style.display = 'none';
    }
  }).catch(() => {});
  pwd.addEventListener('input', () => {
    const v = pwd.value;
    let score = 0;
    if (v.length >= 6) score++;
    if (v.length >= 10) score++;
    if (/[a-zA-Z]/.test(v) && /\d/.test(v)) score++;
    if (/[^a-zA-Z0-9]/.test(v)) score++;
    const map = [
      ['0%', 'var(--line-2)', '建议字母 + 数字组合'],
      ['35%', 'var(--bad)', '太短了，至少 6 位'],
      ['60%', 'var(--warn)', '还可以，再长一点更安全'],
      ['80%', 'var(--ok)', '不错'],
      ['100%', 'var(--ok)', '很安全'],
    ];
    const [w, c, t] = map[Math.min(score, 4)];
    sbar.style.width = w; sbar.style.background = c; stip.textContent = t;
  });

  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#submit');
    const mailEl = $('#mailCode');
    if (mailOn && !mailEl.value.trim()) {
      toast('请先获取并填写邮箱验证码', 'warn');
      mailEl.focus();
      return;
    }
    // 有邮箱验证码时注册接口只校验邮箱码；关掉邮件时才需要人机验证
    let cap = {};
    if (!mailOn) {
      cap = await grabCaptcha();
      if (cap === null) return;
    }
    btn.disabled = true; btn.textContent = '创建中…';
    try {
      await post('/api/auth/register', {
        email: $('#email').value.trim(),
        username: $('#username').value.trim(),
        password: $('#password').value,
        email_code: mailEl.value.trim(),
        ...cap,
      });
      toast('注册成功，已经登录', 'ok');
      setTimeout(() => { location.href = '/studio'; }, 380);
    } catch (err) {
      btn.disabled = false; btn.textContent = '注册并登录';
      toast(err.message || '注册失败', 'bad');
      // 图形码/邮箱码都是一次性的，失败后顺手换一张，省得用户再点一次
      if (capImgOn) loadImageCaptcha();
      if (!/已注册/.test(err.message || '')) mailEl.focus();
    }
  });
  $('#email').focus();
})();
</script>
</body>
</html>
