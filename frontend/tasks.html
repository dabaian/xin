<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务中心 · Viora AI</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/css/app.css?v=20261024b">
<style>
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.f { padding: 6px 13px; border-radius: 20px; border: 1px solid var(--line); background: #fff;
  font-size: 13px; font-weight: 500; color: var(--ink-3); cursor: pointer; transition: all .14s; }
.f:hover { border-color: #DADFE8; color: var(--ink); }
.f.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.tcard { background: #fff; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden;
  display: flex; flex-direction: column; transition: box-shadow .16s, transform .16s; }
.tcard:hover { box-shadow: var(--sh-2); transform: translateY(-1px); }
.tcard .pv { aspect-ratio: 16/10; background: #EEF0F4; position: relative; cursor: pointer; overflow: hidden; }
.tcard .pv video, .tcard .pv img { width: 100%; height: 100%; object-fit: cover; }
.tcard .pv .ph { display: grid; place-items: center; height: 100%; color: var(--muted); }
.tcard .pv .ph svg { width: 46px; height: 46px; opacity: .28; }
.tcard .meta { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.tcard .p-text { font-size: 13px; line-height: 1.5; height: 39px; overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: var(--ink-2); }
.tcard .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 14px; border-top: 1px solid var(--line-2); background: var(--bg-2); }
.pv-badge { position: absolute; top: 8px; left: 8px; padding: 2px 8px; border-radius: 6px;
  background: rgba(0,0,0,.5); color: #fff; font-size: 11px; font-weight: 600; }
</style>
</head>
<body>
<!-- 后端地址等运行时配置由服务端下发；前端独立部署时放一个同内容的 config.js 即可 -->
<script src="/config.js"></script>
<script src="/assets/js/core.js?v=20261024b"></script>
<script>
(async function () {
  const user = await requireUser();
  if (!user) return;
  const root = buildLayout('tasks', user, '任务中心');
  refreshBalance();

  root.innerHTML = `
    <div class="between mb16">
      <div>
        <h2 class="h2">任务中心</h2>
        <p class="sub" style="margin:4px 0 0" id="subline">全部生成记录</p>
      </div>
      <a class="btn btn-primary" href="/studio">＋ 新建生成</a>
    </div>
    <div class="filters" id="filters">
      <button class="f on" data-v="">全部</button>
      <button class="f" data-v="QUEUED,SUBMITTING,SUBMITTED,RUNNING">进行中</button>
      <button class="f" data-v="SUCCEEDED">已完成</button>
      <button class="f" data-v="FAILED,CANCELLED">未成功</button>
      <button class="f" data-v="NEEDS_REVIEW">待对账</button>
    </div>
    <div id="list"><div class="grid-cards">
      ${'<div class="skel" style="height:250px"></div>'.repeat(6)}
    </div></div>
    <div class="center mt24" id="pager"></div>`;

  let state = { status: '', limit: 12, offset: 0, total: 0 };

  $('#filters').addEventListener('click', (e) => {
    const b = e.target.closest('.f');
    if (!b) return;
    $$('#filters .f').forEach((x) => x.classList.toggle('on', x === b));
    state.status = b.dataset.v;
    state.offset = 0;
    load();
  });

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function card(t) {
    const st = STATUS[t.status] || { text: t.status, cls: 'tag' };
    const live = ['QUEUED', 'SUBMITTING', 'SUBMITTED', 'RUNNING'].includes(t.status);
    let preview = `<div class="ph">${ICON.studio}</div>`;
    if (t.media_url && t.status === 'SUCCEEDED') {
      preview = t.kind === 'image'
        ? `<img src="${mediaUrl(t.media_url)}" alt="" loading="lazy">
           <div class="pv-badge">图片 · ${t.aspect_ratio || '1:1'}</div>`
        : `<video src="${mediaUrl(t.media_url)}#t=0.1" preload="metadata" muted playsinline></video>
           <div class="pv-badge">${t.duration || 10}s · ${t.aspect_ratio || '9:16'}</div>`;
    } else if (live) {
      const pct = t.progress || (st.pct || 8);
      preview = `<div class="ph" style="flex-direction:column;gap:10px">
        <div class="spin" style="border-color:rgba(37,99,235,.2);border-top-color:#2563EB"></div>
        <div style="font-size:12px;color:var(--info);font-weight:600">${st.text} ${pct}%</div>
      </div>`;
    }
    return `
    <div class="tcard" data-id="${t.id}">
      <div class="pv" data-open="${mediaUrl(t.media_url) || ''}">${preview}</div>
      <div class="meta">
        <div class="p-text">${esc(t.prompt)}</div>
        <div class="row" style="justify-content:space-between">
          ${statusTag(t.status)}
          <span class="muted mono" style="font-size:12px">-${t.points} 积分</span>
        </div>
      </div>
      <div class="foot">
        <span class="muted" style="font-size:12px">${fmt.ago(t.created_at)}</span>
        <div class="row" style="gap:6px">
          ${t.media_url && t.status === 'SUCCEEDED'
            ? `<button class="btn btn-sm" data-dl="${mediaUrl(t.media_url)}" data-name="musestudio-${t.id.slice(0,8)}${t.kind === 'image' ? '.png' : '.mp4'}">下载</button>`
            : ''}
          ${live ? `<button class="btn btn-sm btn-ghost" data-cancel="${t.id}">取消</button>` : ''}
          <button class="btn btn-sm btn-ghost" data-detail="${t.id}">详情</button>
        </div>
      </div>
    </div>`;
  }

  async function load() {
    try {
      const q = new URLSearchParams({ limit: state.limit, offset: state.offset });
      if (state.status) q.set('status', state.status);
      const r = await get('/api/tasks?' + q.toString());
      state.total = r.total;
      const box = $('#list');
      if (!r.items.length) {
        box.innerHTML = `<div class="card empty">
          ${ICON.tasks}<div>这里还是空的</div>
          <div class="sub" style="margin-top:6px">去工作台生成第一条视频吧</div>
          <a class="btn btn-primary mt16" href="/studio">开始创作</a></div>`;
        $('#pager').innerHTML = '';
        return;
      }
      box.innerHTML = `<div class="grid-cards">${r.items.map(card).join('')}</div>`;
      $('#subline').textContent = `共 ${r.total} 条记录`;
      renderPager();
      bind();
    } catch (e) { toast(e.message, 'bad'); }
  }

  function renderPager() {
    const page = Math.floor(state.offset / state.limit) + 1;
    const pages = Math.max(1, Math.ceil(state.total / state.limit));
    $('#pager').innerHTML = pages > 1 ? `
      <div class="row" style="justify-content:center">
        <button class="btn btn-sm" ${page <= 1 ? 'disabled' : ''} id="prev">上一页</button>
        <span class="sub">${page} / ${pages}</span>
        <button class="btn btn-sm" ${page >= pages ? 'disabled' : ''} id="next">下一页</button>
      </div>` : '';
    const p = $('#prev'), n = $('#next');
    if (p) p.onclick = () => { state.offset -= state.limit; load(); };
    if (n) n.onclick = () => { state.offset += state.limit; load(); };
  }

  function bind() {
    $$('[data-dl]').forEach((b) => {
      b.onclick = (e) => { e.stopPropagation(); downloadUrl(b.dataset.dl, b.dataset.name); };
    });
    $$('[data-open]').forEach((el) => {
      el.onclick = () => { if (el.dataset.open) openPreview(el.dataset.open); };
    });
    $$('[data-cancel]').forEach((b) => {
      b.onclick = async (e) => {
        e.stopPropagation();
        if (!await confirmBox('取消任务', '确定取消吗？积分会立即退回。', '取消任务', true)) return;
        try { await post('/api/tasks/' + b.dataset.cancel + '/cancel'); toast('已取消', 'ok'); load(); refreshBalance(); }
        catch (err) { toast(err.message, 'bad'); }
      };
    });
    $$('[data-detail]').forEach((b) => {
      b.onclick = async () => {
        try {
          const r = await get('/api/tasks/' + b.dataset.detail);
          showDetail(r.task);
        } catch (e) { toast(e.message, 'bad'); }
      };
    });
  }

  function openPreview(url) {
    const m = modal({
      title: '预览', wide: true,
      body: `<video src="${url}" controls autoplay playsinline style="width:100%;border-radius:12px;background:#000;max-height:70vh"></video>`,
    });
  }

  function showDetail(t) {
    const rows = [
      ['状态', STATUS[t.status] ? STATUS[t.status].text : t.status],
      ['积分', t.points],
      ['比例 / 时长', `${t.aspect_ratio || '—'} · ${t.duration || '—'}s`],
      ['清晰度', t.resolution || '—'],
      ['创建时间', fmt.time(t.created_at)],
      ['完成时间', t.finished_at ? fmt.time(t.finished_at) : '—'],
      ['任务号', t.id],
    ];
    const attempts = (t.attempts || []).map((a) =>
      `<tr><td>第 ${a.attempt_no} 次</td><td>${a.status}</td><td class="muted">${a.error_code || ''}</td>
       <td class="muted mono">${fmt.time(a.started_at)}</td></tr>`).join('');
    modal({
      title: '任务详情', wide: true,
      body: `
        <table class="table" style="margin-bottom:16px">
          ${rows.map(([k, v]) => `<tr><td class="muted" style="width:110px">${k}</td><td class="mono">${esc(String(v))}</td></tr>`).join('')}
        </table>
        <div class="label">提示词</div>
        <div class="card card-pad" style="font-size:13px;line-height:1.7;background:var(--bg-2)">${esc(t.prompt)}</div>
        ${t.error ? `<div class="label mt16">错误信息</div>
          <div class="card card-pad" style="font-size:13px;color:var(--bad);background:var(--bad-soft)">${esc(t.error)}</div>` : ''}
        ${attempts ? `<div class="label mt16">调用记录</div>
          <table class="table"><thead><tr><th>尝试</th><th>结果</th><th>错误码</th><th>时间</th></tr></thead>
          <tbody>${attempts}</tbody></table>` : ''}
        ${t.media_url ? `<div class="mt16"><a class="btn btn-primary btn-block" href="${mediaUrl(t.media_url)}" download>下载视频</a></div>` : ''}`,
    });
  }

  await load();

  // 有进行中的任务时自动刷新
  poller(async () => {
    const hasLive = $$('.tcard').length && document.querySelector('.spin');
    if (hasLive) await load();
  }, 5000);
})();
</script>
</body>
</html>
