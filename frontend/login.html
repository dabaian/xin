<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · Viora AI</title>
<link rel="icon" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/css/app.css?v=20261028">
<style>
.split { display: grid; grid-template-columns: 1.05fr 1fr; min-height: 100vh; }
.side {
  position: relative; overflow: hidden; padding: 44px; color: var(--ink);
  background: #080B12;
  display: flex; flex-direction: column; justify-content: space-between;
}
/* 一层极细的等距竖线，像调色台上的刻度槽 */
.side::before {
  content: ''; position: absolute; inset: 0;
  background:
    repeating-linear-gradient(90deg, rgba(91, 140, 255,.05) 0 1px, transparent 1px 64px),
    radial-gradient(circle at 78% 8%, rgba(91, 140, 255,.20), transparent 58%),
    radial-gradient(circle at 12% 96%, rgba(91, 140, 255,.09), transparent 52%);
}
/* 右侧一条黄铜发丝，把两块面板切开 */
.side::after {
  content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 1px;
  background: linear-gradient(180deg, transparent, rgba(91, 140, 255,.34) 22%, rgba(91, 140, 255,.34) 78%, transparent);
}
.side > * { position: relative; z-index: 1; }
.side .logo { display: flex; align-items: center; gap: 11px; font-weight: 600; font-size: 15.5px; }
.side .logo .m { width: 32px; height: 32px; border-radius: var(--r-sm); object-fit: cover;
  box-shadow: 0 0 0 1px rgba(91, 140, 255,.24); }
.side h1 { font-size: clamp(30px, 3.4vw, 41px); line-height: 1.2; letter-spacing: -.028em;
  margin: 0 0 14px; font-weight: 600; }
.side h1 em { font-style: normal; color: var(--brand); }
.side p { color: var(--ink-3); font-size: 13.5px; max-width: 372px; line-height: 1.8; }
.side .pts { display: grid; gap: 13px; margin-top: 28px; }
.side .pts div { display: flex; gap: 10px; font-size: 13px; color: var(--ink-2); }
.side .pts i { width: 17px; height: 17px; border-radius: 50%; background: transparent;
  color: var(--brand); display: grid; place-items: center; font-size: 9.5px; font-style: normal;
  font-weight: 600; flex: 0 0 17px; margin-top: 2px;
  box-shadow: inset 0 0 0 1px rgba(91, 140, 255,.4); }
.side .foot { color: #5C6675; font-size: 11.5px; letter-spacing: .02em; }

.form-side { display: grid; place-items: center; padding: 40px 24px; background: var(--bg); }
.form-box { width: 100%; max-width: 372px; }
#mobile { letter-spacing: .04em; }
.hint { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
.pwd-label { display: flex; align-items: baseline; justify-content: space-between; }
.pwd-label a { font-size: 12px; color: var(--brand); font-weight: 600; text-decoration: none; }
.pwd-label a:hover { text-decoration: underline; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } .side { display: none; } }
</style>
</head>
<body>
<div class="split">
  <div class="side">
    <div class="logo"><img class="m" src="/assets/logo-mark.png" alt="Viora AI">Viora AI</div>
    <div>
      <h1>把一句话，<br>变成<em>能发的艺术品</em>。</h1>
      <p>面向短视频与电商内容的 AI 视频工作台。文本或图片进，10 秒成片出，按条计费，不用订阅。</p>
      <div class="pts">
        <div><i>✓</i><span>文生视频 / 图生视频，竖屏横屏一键切换</span></div>
        <div><i>✓</i><span>排队可见、失败自动退积分，不玩黑箱</span></div>
        <div><i>✓</i><span>扫码充值即时到账，积分永不过期</span></div>
      </div>
    </div>
    <div class="foot">© 2026 Viora AI · 内容由 AI 生成，请遵守平台规范</div>
  </div>

  <div class="form-side">
    <div class="form-box" id="box">
      <h2 class="h2" style="margin-bottom:6px">登录</h2>
      <p class="sub mb24">用注册时填的手机号继续</p>

      <form id="form" novalidate>
        <div class="field">
          <label class="label">手机号</label>
          <input class="input" id="mobile" type="tel" autocomplete="username" inputmode="numeric"
                 maxlength="11" placeholder="11 位手机号" required>
        </div>

        <div class="field">
          <div class="pwd-label">
            <label class="label" style="margin:0">密码</label>
            <a href="/forgot" id="forgotLink">忘记密码？</a>
          </div>
          <input class="input" id="password" type="password" autocomplete="current-password"
                 placeholder="••••••••" required>
        </div>

        <div class="between mb16">
          <label class="row" style="gap:6px;font-size:13px;color:var(--ink-3);cursor:pointer">
            <input type="checkbox" id="remember" checked> 保持登录
          </label>
          <span></span>
        </div>
        <button class="btn btn-primary btn-lg btn-block" id="submit" type="submit">登录</button>
      </form>
      <p class="sub center mt24">还没有账号？<a href="/register" style="color:var(--brand);font-weight:600">免费注册</a></p>
    </div>
  </div>
</div>
<!-- 后端地址等运行时配置由服务端下发；前端独立部署时放一个同内容的 config.js 即可 -->
<script src="/config.js"></script>
<script src="/assets/js/core.js?v=20261028"></script>
<script>
(function () {
  const qs = new URLSearchParams(location.search);
  const next = qs.get('next') || '/studio';
  const $mob = $('#mobile'), $pwd = $('#password');
  const MOBILE_RE = /^1[3-9]\d{9}$/;

  // 已登录直接跳走
  get('/api/auth/me').then(() => { location.href = next; }).catch(() => {});

  function normMobile(v) { return (v || '').replace(/\D/g, '').slice(0, 11); }
  $mob.addEventListener('input', () => {
    const clean = normMobile($mob.value);
    if (clean !== $mob.value) $mob.value = clean;
  });

  // 从注册页 / 找回密码页带过来的手机号自动填上
  const preset = qs.get('account') || qs.get('mobile');
  if (preset) { $mob.value = normMobile(preset); $pwd.focus(); } else { $mob.focus(); }

  // 忘记密码时把手机号带过去，少输一次
  $('#forgotLink').addEventListener('click', () => {
    const m = normMobile($mob.value);
    if (m) $('#forgotLink').href = '/forgot?mobile=' + encodeURIComponent(m);
  });

  $('#form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const mobile = normMobile($mob.value);
    if (!MOBILE_RE.test(mobile)) { toast('请填写正确的 11 位手机号', 'warn'); $mob.focus(); return; }
    if (!$pwd.value) { toast('请填写密码', 'warn'); $pwd.focus(); return; }

    const btn = $('#submit');
    btn.disabled = true; btn.textContent = '登录中…';
    try {
      await post('/api/auth/login', {
        account: mobile,
        password: $pwd.value,
        remember: $('#remember').checked,
      });
      toast('欢迎回来', 'ok');
      setTimeout(() => { location.href = next; }, 320);
    } catch (err) {
      btn.disabled = false; btn.textContent = '登录';
      toast(err.message || '登录失败', 'bad');
      $pwd.select();
    }
  });
})();
</script>
</body>
</html>
